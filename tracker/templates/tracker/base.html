<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Time Tracker</title>
</head>

<body style="font-family: Arial, sans-serif; margin: 0; padding: 0;">

  <nav style="background-color: #2c3e50; padding: 15px;">
    <a href="{% url 'project_list' %}" style="color: white; margin-right: 20px; text-decoration: none; font-weight: bold;">Projetos</a>
    <a href="{% url 'task_list' %}" style="color: white; text-decoration: none; font-weight: bold; padding: 15px">Tarefas</a>
    <a href="{% url 'time_list' %}" style="color: white; text-decoration: none; font-weight: bold; padding: 15px">Registros de Tempo</a>
    <hr>
    {% if user.is_authenticated %}
    <span>Olá, {{ user.username }}</span>
    <form action="{% url 'logout' %}" method="POST" style="display: inline;">
      {% csrf_token %}
      <button type="submit" style="cursor: pointer;">Sair do sistema</button>
    </form>
    {% else %}
    <a href="{% url 'login' %}">Entrar no sistema</a>
    {% endif %}
    <hr>
  </nav>

  <main style="padding: 20px;">

    {% block content %}
    {% endblock %}

  </main>

</body>

</html>
